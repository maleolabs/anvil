pipeline:
    name: build
    stages:
        - name: dependencies
          tasks:
            - name: download
              command: go
              args:
                - mod
                - download
            - name: verify
              command: go
              args:
                - mod
                - verify
        - name: compile
          tasks:
            - name: linux-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-linux-amd64 .
              env:
                GOOS: linux
                GOARCH: amd64
            - name: linux-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-linux-arm64 .
              env:
                GOOS: linux
                GOARCH: arm64
            - name: darwin-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-darwin-amd64 .
              env:
                GOOS: darwin
                GOARCH: amd64
            - name: darwin-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-darwin-arm64 .
              env:
                GOOS: darwin
                GOARCH: arm64
            # Adapter binaries (TS-007-034): built after the CLI tasks so
            # CLI-first ordering is preserved. The ldflags stamp mirrors the
            # CLI pattern; adapters do not link maleolabs.com/anvil/cmd, so
            # the linker ignores the -X flag (verified: builds succeed and
            # the stamp is harmless).
            - name: adapter-laravel-linux-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-adapter-laravel-linux-amd64 ./cmd/laravel-adapter
              env:
                GOOS: linux
                GOARCH: amd64
            - name: adapter-laravel-linux-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-adapter-laravel-linux-arm64 ./cmd/laravel-adapter
              env:
                GOOS: linux
                GOARCH: arm64
            - name: adapter-laravel-darwin-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-adapter-laravel-darwin-amd64 ./cmd/laravel-adapter
              env:
                GOOS: darwin
                GOARCH: amd64
            - name: adapter-laravel-darwin-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-adapter-laravel-darwin-arm64 ./cmd/laravel-adapter
              env:
                GOOS: darwin
                GOARCH: arm64
            - name: adapter-flutter-linux-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-adapter-flutter-linux-amd64 ./cmd/flutter-adapter
              env:
                GOOS: linux
                GOARCH: amd64
            - name: adapter-flutter-linux-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-adapter-flutter-linux-arm64 ./cmd/flutter-adapter
              env:
                GOOS: linux
                GOARCH: arm64
            - name: adapter-flutter-darwin-amd64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-adapter-flutter-darwin-amd64 ./cmd/flutter-adapter
              env:
                GOOS: darwin
                GOARCH: amd64
            - name: adapter-flutter-darwin-arm64
              command: sh
              args:
                - -c
                - |
                  VERSION=$(git describe --tags --always 2>/dev/null || echo "0.0.0-dev")
                  go build -ldflags="-X maleolabs.com/anvil/cmd.CliVersion=${VERSION}" -o ${ANVIL_OUTPUT_DIR}/anvil-adapter-flutter-darwin-arm64 ./cmd/flutter-adapter
              env:
                GOOS: darwin
                GOARCH: arm64
