[package]
name = "anvil-installer-gui"
version = "2.5.0"
edition = "2021"
description = "Anvil Pure GUI Installer - Tauri wrapper (offline, fail-closed, redacted)"
authors = ["Anvil"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
tauri-plugin-dialog = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
